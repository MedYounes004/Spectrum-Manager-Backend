spring.application.name=REPORTING-SERVICE
server.port=8085

# Désactiver Config Server
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# URLs des autres services (via Gateway)
services.autorisation.url=http://localhost:8083/api/autorisations
services.facturation.url=http://localhost:8083/api/factures

# Logging
logging.level.tn.sfm.reportingservice=DEBUG
logging.level.com.netflix.discovery=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
server.port=8083
spring.application.name=GATEWAY
spring.security.enabled=false

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
#spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Routes pour les nouveaux services
spring.cloud.gateway.routes[1].id=autorisation-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/autorisations/**
#spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=facturation-service
spring.cloud.gateway.routes[2].uri=http://localhost:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/factures/**
#spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=reporting-service
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reports/**
#spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# === NOUVEAU : Route Client Service ===
spring.cloud.gateway.routes[4].id=client-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/clients/**
#spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# Client Dashboard Routes
spring.cloud.gateway.routes[5].id=client-dashboard
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/client/**
#spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1
# ? NOUVEAU : Route pour l'authentification (auth)
spring.cloud.gateway.routes[6].id=auth-service
spring.cloud.gateway.routes[6].uri=http://localhost:8081
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/auth/**
# Route pour l'API des formules (service facturation)
spring.cloud.gateway.routes[7].id=formule-service
spring.cloud.gateway.routes[7].uri=http://localhost:8084
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/formules/**
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.netflix.discovery=DEBUG